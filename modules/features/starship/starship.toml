"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌──](bold border)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$time
[└─](bold border)$character """

palette = "cyberpunk_rc"

add_newline = true

[palettes.cyberpunk_rc]
red       = "#e3000f"
red_dim   = "#8a0010"
violet    = "#7c3aed"
violet_dim = "#4c1d95"
purple    = "#a855f7"
magenta   = "#d926e0"
border    = "#5b21b6"
muted     = "#6b5b8f"

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold magenta'
style_root = 'bold red'

[hostname]
ssh_only = false
format = '[@$hostname]($style)'
style = 'purple'

[directory]
format = ' [$path]($style)'
style = 'bold violet'
truncation_length = 3
truncation_symbol = '…/'
home_symbol = '~'

[git_branch]
symbol = ' ⎇ '
format = '[$symbol$branch]($style)'
style = 'bold magenta'

[git_status]
format = ' [$conflicted](bold red)[$deleted](bold red)[$modified](purple)[$staged](magenta)[$untracked](violet)[$ahead_behind](muted)'

conflicted = '⚡'
ahead      = '⇡${count}'
behind     = '⇣${count}'
modified   = '!${count}'
untracked  = '?${count}'
staged     = '+${count}'
deleted    = '✗${count}'

[cmd_duration]
min_time = 1000
format = ' [${duration}]($style)'
style = 'muted'

[time]
disabled = false
time_format = '%H:%M'
format = ' [$time]($style)'
style = 'bold violet_dim'

[character]
success_symbol = '[ ➤](bold violet)'
error_symbol   = '[ ➤](bold red)'
vimcmd_symbol  = '[◆](bold red)'

[python]
disabled = false
detect_extensions = ["py"]

[nodejs]
disabled = false
detect_extensions = ["js", "ts", "tsx", "mjs"]

[rust]
disabled = false
detect_extensions = ["rs"]

[java]
disabled = false
detect_extensions = ["java"]

[docker_context]
disabled = true

[os]
disabled = true
