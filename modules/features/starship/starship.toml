"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌──](bold border)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$time
[└─](bold border)$character """

palette = "purpleFlames"

add_newline = true

[palettes.purpleFlames]
red        = "#ff0044"
red_dim    = "#5c0015"
violet     = "#a600ff"
violet_dim = "#1a0530"
purple     = "#c77dff"
magenta    = "#ff00c8"
flash      = "#f2e9ff"
border     = "#ff00c8"
muted      = "#4a3b6b"

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold magenta'
style_root = 'bold red'

[hostname]
ssh_only = false
format = '[@$hostname]($style)'
style = 'bold purple'

[directory]
format = ' [$path]($style)'
style = 'bold violet'
truncation_length = 3
truncation_symbol = '…/'
home_symbol = '~'

[git_branch]
symbol = ' ⎇ '
format = '[$symbol$branch]($style)'
style = 'bold magenta'

[git_status]
format = ' [$conflicted](bold red)[$deleted](bold red)[$modified](bold purple)[$staged](bold magenta)[$untracked](violet)[$ahead_behind](muted)'

conflicted = '⚡'
ahead      = '⇡${count}'
behind     = '⇣${count}'
modified   = '!${count}'
untracked  = '?${count}'
staged     = '+${count}'
deleted    = '✗${count}'

[cmd_duration]
min_time = 1000
format = ' [${duration}]($style)'
style = 'bold flash'

[time]
disabled = false
time_format = '%H:%M'
format = ' [$time]($style)'
style = 'bold flash'

[character]
success_symbol = '[ ➤](bold violet)'
error_symbol   = '[ ➤](bold red)'
vimcmd_symbol  = '[◆](bold red)'

[python]
disabled = false
detect_extensions = ["py"]

[nodejs]
disabled = false
detect_extensions = ["js", "ts", "tsx", "mjs"]

[rust]
disabled = false
detect_extensions = ["rs"]

[java]
disabled = false
detect_extensions = ["java"]

[docker_context]
disabled = true

[os]
disabled = true
